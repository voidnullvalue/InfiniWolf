name: Add web link once

on:
  push:
    branches:
      - agent/add-web-link

permissions:
  contents: write

jobs:
  edit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/add-web-link
      - name: Insert web link and remove this workflow
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("README.md")
          text = path.read_text(encoding="utf-8")
          needle = "</p>\n\n</div>"
          replacement = "</p>\n\n<p><a href=\"https://voidnullvalue.github.io/InfiniWolf/\">Try InfiniWolf in your browser</a></p>\n\n</div>"
          if replacement not in text:
              if needle not in text:
                  raise SystemExit("README badge block not found")
              path.write_text(text.replace(needle, replacement, 1), encoding="utf-8")
          Path(".github/workflows/add-web-link-once.yml").unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md .github/workflows/add-web-link-once.yml
          git commit -m "Add browser version link"
          git push
