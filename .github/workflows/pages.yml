name: Browser Generator

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - ".github/workflows/pages.yml"
      - "assets/infiniwolf-logo.png"
      - "infiniwolf/**"
      - "pyproject.toml"
      - "tests/test_web.py"
      - "web/**"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: browser-generator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install build tooling
        run: python -m pip install --upgrade build

      - name: Test browser adapter
        run: python -m unittest discover -s tests -p "test_web.py" -v

      - name: Stamp current commit
        run: python packaging/stamp_build.py --commit "${GITHUB_SHA}"

      - name: Build current InfiniWolf wheel
        run: python -m build --wheel --outdir dist

      - name: Assemble static site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf site
          mkdir -p site/assets
          cp -R web/. site/
          cp assets/infiniwolf-logo.png site/assets/
          touch site/.nojekyll
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import shutil
          import tomllib

          wheels = list(Path("dist").glob("*.whl"))
          if len(wheels) != 1:
              raise SystemExit(f"expected one wheel, found {len(wheels)}")
          wheel = wheels[0]
          commit = os.environ["GITHUB_SHA"]
          wheel_dir = Path("site/builds") / commit
          wheel_dir.mkdir(parents=True)
          shutil.copy2(wheel, wheel_dir / wheel.name)
          version = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          Path("site/build.json").write_text(json.dumps({
              "wheel": f"builds/{commit}/{wheel.name}",
              "version": version,
              "commit": commit,
          }, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Verify wheel contains browser adapter
        shell: bash
        run: |
          python -m pip install --force-reinstall dist/*.whl
          python -c 'from infiniwolf.web import campaign_config, check_for_web, generate_for_web; print(campaign_config({"seed": 1}).seed)'

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy current main build
        id: deployment
        uses: actions/deploy-pages@v4
